name: build
on:
  push:
    paths:
      - blueprint.yaml
      - mine-proxy.list
      - mine-direct.list
      - scripts/build.py
      - scripts/route_test.py
      - .github/workflows/build.yml
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: compile (fail-closed + floors inside build.py)
        run: python3 scripts/build.py
      - name: route canaries (semantic first-match test, both artifacts)
        run: python3 scripts/route_test.py
      - name: mihomo -t (syntax/load check on a harness with a dummy node)
        run: |
          ver=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
                | grep -oP '"tag_name":\s*"\K[^"]+')
          curl -fsSL -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${ver}/mihomo-linux-amd64-${ver}.gz"
          gunzip mihomo.gz && chmod +x mihomo
          cp clash-rules.yaml harness.yaml
          printf '\nproxies:\n  - {name: dummy, type: socks5, server: 127.0.0.1, port: 1080}\n' >> harness.yaml
          mkdir -p mihomo-home
          ./mihomo -t -f harness.yaml -d mihomo-home
      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadowrocket.conf clash-rules.yaml proxy-routes.list
          if ! git diff --staged --quiet; then
            git commit -m "regen: $(sed -n '2s/^# //p' shadowrocket.conf)"
            git push
          fi
